      </g>
    </symbol>
    <style>
      .bg { fill: #f7f0e6; }
      .ink { fill: #17263a; }
      .muted { fill: #536071; }
      .accent { fill: #e9a27f; }
      .card { fill: #fffaf2; stroke: rgba(23,38,58,0.13); stroke-width: 1; }
      .darkTile { fill: #101a2b; }
      .label { font-family: "Inter", "Segoe UI", Arial, sans-serif; font-size: 15px; letter-spacing: 4px; font-weight: 700; }
      .name { font-family: "Cormorant Garamond", Georgia, serif; font-size: 34px; font-weight: 400; }
      .copy { font-family: "Inter", "Segoe UI", Arial, sans-serif; font-size: 18px; letter-spacing: 0; }
      .tiny { font-family: "Inter", "Segoe UI", Arial, sans-serif; font-size: 12px; letter-spacing: 2.5px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1440" height="960" class="bg"/>
  <circle cx="1315" cy="95" r="4" class="accent"/>
  <circle cx="108" cy="836" r="4" class="accent"/>

  <text x="78" y="86" class="tiny ink">AV DESIGN</text>
  <text x="78" y="142" class="name ink">Sunburst logo concepts</text>
  <text x="80" y="181" class="copy muted">Refined thin-line marks with controlled wavy rays, kept clean enough for the homepage header.</text>

  <g transform="translate(80 250)" filter="url(#softShadow)">
    <rect width="390" height="550" rx="8" class="card"/>
    <use href="#editorial" x="70" y="48" width="250" height="250" style="color:#17263a"/>
    <rect x="262" y="276" width="76" height="76" rx="8" class="darkTile"/>
    <use href="#editorial" x="275" y="289" width="50" height="50" style="color:#f7f0e6"/>
    <text x="38" y="365" class="label ink">01</text>
    <text x="38" y="417" class="name ink">Editorial Radiance</text>
    <text x="38" y="458" class="copy muted">The softest and most luxurious.</text>
    <text x="38" y="489" class="copy muted">Best for a full brand mark.</text>
    <path d="M38 514h86" stroke="#e9a27f" stroke-width="2"/>
  </g>

  <g transform="translate(525 250)" filter="url(#softShadow)">
    <rect width="390" height="550" rx="8" class="card"/>
    <use href="#compact" x="70" y="48" width="250" height="250" style="color:#17263a"/>
    <rect x="262" y="276" width="76" height="76" rx="8" class="darkTile"/>
    <use href="#compact" x="275" y="289" width="50" height="50" style="color:#f7f0e6"/>
    <text x="38" y="365" class="label ink">02</text>
    <text x="38" y="417" class="name ink">Compact Wave</text>
    <text x="38" y="458" class="copy muted">The cleanest small-size option.</text>
    <text x="38" y="489" class="copy muted">Best for favicon and nav.</text>
    <path d="M38 514h86" stroke="#e9a27f" stroke-width="2"/>
  </g>

  <g transform="translate(970 250)" filter="url(#softShadow)">
    <rect width="390" height="550" rx="8" class="card"/>
    <use href="#horizon" x="70" y="48" width="250" height="250" style="color:#17263a"/>
    <rect x="262" y="276" width="76" height="76" rx="8" class="darkTile"/>
    <use href="#horizon" x="275" y="289" width="50" height="50" style="color:#f7f0e6"/>
    <text x="38" y="365" class="label ink">03</text>
    <text x="38" y="417" class="name ink">Horizon Radiance</text>
    <text x="38" y="458" class="copy muted">The most tied to the website.</text>
    <text x="38" y="489" class="copy muted">Best beside the AV wordmark.</text>
    <path d="M38 514h86" stroke="#e9a27f" stroke-width="2"/>
  </g>

  <text x="80" y="872" class="copy muted">Recommendation: start with 03 for the homepage logo, and keep 02 as the favicon variant.</text>
</svg>
