<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Avery Vale sunburst logo concepts</title>
  <desc id="desc">Three refined sunburst logo concepts with thin controlled wavy rays, shown on light and dark surfaces.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#17263a" flood-opacity="0.12"/>
    </filter>
    <symbol id="editorial" viewBox="0 0 512 512">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path stroke-width="5" d="M256 174c51 0 84 33 84 84s-33 84-84 84-84-33-84-84 33-84 84-84Z"/>
        <g stroke-width="4">
          <path d="M257 78c-9 18-7 42 1 58"/>
          <path d="M319 94c-3 19-11 34-25 47"/>
          <path d="M395 137c-19 8-33 22-41 41"/>
          <path d="M435 220c-19-5-38-3-56 8"/>
          <path d="M429 306c-20-6-37-2-53 12"/>
          <path d="M369 394c-19-8-32-22-37-42"/>
          <path d="M256 435c8-21 7-43-1-59"/>
          <path d="M139 395c21-11 33-25 39-44"/>
          <path d="M82 309c22-6 39-2 54 10"/>
          <path d="M79 221c20-7 40-4 57 8"/>
          <path d="M117 137c20 9 34 23 42 41"/>
          <path d="M194 93c4 20 11 35 25 48"/>
        </g>
        <path stroke="#e9a27f" stroke-width="3.5" d="M166 151c14-22 34-40 58-51"/>
      </g>
    </symbol>
    <symbol id="compact" viewBox="0 0 512 512">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="256" cy="256" r="80" stroke-width="5.5"/>
        <circle cx="256" cy="256" r="18" stroke="#e9a27f" stroke-width="4"/>
        <g stroke-width="4.5">
          <path d="M256 91c-6 19-6 38 0 56"/>
          <path d="M352 124c-14 13-23 29-27 48"/>
          <path d="M420 206c-19 0-36 7-51 20"/>
          <path d="M420 306c-19-2-37 4-52 17"/>
          <path d="M352 388c-15-13-24-30-27-49"/>
          <path d="M256 421c7-18 7-38 0-56"/>
          <path d="M160 388c14-13 23-30 27-49"/>
          <path d="M92 306c19-2 37 4 52 17"/>
          <path d="M92 206c19 0 36 7 51 20"/>
          <path d="M160 124c14 13 23 29 27 48"/>
        </g>
      </g>
    </symbol>
    <symbol id="horizon" viewBox="0 0 512 512">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="256" cy="258" r="82" stroke-width="5"/>
        <path stroke="#e9a27f" stroke-width="4" d="M193 276c35-29 91-29 126 0"/>
        <path stroke-width="4" d="M210 303h92"/>
        <g stroke-width="4">
          <path d="M256 78c-8 19-7 41 0 58"/>
          <path d="M319 96c-6 18-16 32-31 44"/>
          <path d="M386 138c-18 8-31 22-38 40"/>
          <path d="M428 211c-20-3-38 3-54 16"/>
          <path d="M434 289c-20-6-38-2-54 10"/>
          <path d="M389 367c-18-6-32-19-41-37"/>
          <path d="M320 419c-11-16-17-34-17-54"/>
          <path d="M256 440c7-18 7-38 0-56"/>
          <path d="M192 419c11-16 17-34 17-54"/>
          <path d="M123 367c18-6 32-19 41-37"/>
          <path d="M78 289c20-6 38-2 54 10"/>
          <path d="M84 211c20-3 38 3 54 16"/>
          <path d="M126 138c18 8 31 22 38 40"/>
          <path d="M193 96c6 18 16 32 31 44"/>
